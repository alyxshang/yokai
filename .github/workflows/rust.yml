on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    
      - uses: actions/checkout@v6
      
      - name: "Run unit tests."
        uses: actions-rs/cargo@v1
        with: 
          command: test

      - name: "Run linter."
        uses: actions-rs/cargo@v1
        with: 
          command: clippy
